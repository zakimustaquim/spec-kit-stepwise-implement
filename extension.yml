schema_version: "1.0"

extension:
  id: "stepwise-implement"
  name: "Stepwise Implement"
  version: "1.0.2"
  description: "Run tasks.md one task at a time with a human approval gate between units, logging deviations to deviations.md."
  category: "process"
  effect: "read-write"
  author: "Zaki Mustaquim"
  repository: "https://github.com/zakimustaquim/spec-kit-stepwise-implement"
  license: "MIT"
  homepage: "https://github.com/zakimustaquim/spec-kit-stepwise-implement"

requires:
  speckit_version: ">=0.1.0"
  commands:
    - "speckit.tasks"

provides:
  commands:
    # The manifest pattern is speckit.{extension-id}.{command}, so the primary name
    # carries a third segment. The two-segment alias is the invocation users type.
    - name: "speckit.stepwise-implement.run"
      file: "commands/speckit.stepwise-implement.run.md"
      description: "Execute the next task (or batch) from tasks.md, then halt for approval"
      aliases: ["speckit.stepwise-implement"]

tags:
  - "implementation"
  - "workflow"
  - "approval-gate"
  - "deviations"
